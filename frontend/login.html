<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — PulseGuard AI</title><link rel="stylesheet" href="style.css"></head><body class="authbody"><div class="authwrap"><a class="brand dark" href="/"><span>❤</span><b>PulseGuard AI</b></a><div class="authcard"><span class="eyebrow">WELCOME BACK</span><h1>Sign in to your dashboard</h1><p>Continue your monitoring session and view your personal history.</p><form id="form"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><div id="error" class="error"></div><button class="primary bigbtn" type="submit">Sign in →</button></form><div class="demo-box"><b>Want to see it immediately?</b><p>Demo username: <code>demo</code> · Password: <code>pulse123</code></p><button id="demo" class="secondary">Use demo account</button></div><p class="switch">New here? <a href="/register">Create an account</a></p></div></div><script>
const f=document.getElementById("form"),e=document.getElementById("error");f.onsubmit=async x=>{x.preventDefault();let r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value,password:password.value})});let d=await r.json();if(r.ok)location="/app";else e.textContent=d.error};document.getElementById("demo").onclick=()=>{username.value="demo";password.value="pulse123";f.requestSubmit()};
</script></body></html>
