<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — PulseGuard AI</title><link rel="stylesheet" href="style.css"></head><body class="authbody"><div class="authwrap"><a class="brand dark" href="/"><span>❤</span><b>PulseGuard AI</b></a><div class="authcard"><span class="eyebrow">PERSONAL DASHBOARD</span><h1>Create your account</h1><p>Your name will appear on your private local dashboard. This demo stores data only in the local project database.</p><form id="form"><label>Your name<input id="name" required></label><label>Username<input id="username" required minlength="3"></label><label>Password<input id="password" type="password" required minlength="6"></label><div id="error" class="error"></div><button class="primary bigbtn" type="submit">Create my dashboard →</button></form><p class="switch">Already have an account? <a href="/login">Sign in</a></p></div></div><script>
const f=document.getElementById("form"),e=document.getElementById("error");f.onsubmit=async x=>{x.preventDefault();let r=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,username:username.value,password:password.value})});let d=await r.json();if(r.ok)location="/app";else e.textContent=d.error};
</script></body></html>
